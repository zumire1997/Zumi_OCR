name: 1. Generar clave de auto-actualizador (solo 1 vez)

on:
  workflow_dispatch:

jobs:
  keygen:
    runs-on: windows-latest
    steps:
      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-v2-${{ runner.os }}

      - name: Instalar Tauri CLI v2
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      - name: Generar par de claves de firma Tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path keys_out | Out-Null
          cargo tauri signer generate --ci -w keys_out/zumi_updater.key

      - name: Subir claves (descarga y luego borra este artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Claves-Actualizador-Zumi
          path: keys_out/*
          retention-days: 1
