name: Compilar Zumi OCR (.exe para Windows)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Cache de Tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-v2-${{ runner.os }}

      - name: Instalar Tauri CLI v2
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      - name: Compilar Zumi OCR (.exe e instalador)
        run: cargo tauri build

      - name: Preparar carpeta de descarga
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_out | Out-Null
          Copy-Item "src-tauri/target/release/zumi-ocr.exe" "release_out/Zumi_OCR_Portable.exe" -ErrorAction SilentlyContinue
          Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Copy-Item -Destination release_out/
          Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Copy-Item -Destination release_out/
          Get-ChildItem release_out

      - name: Subir instalador y .exe listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Zumi-OCR-Windows-EXE
          path: release_out/*
